<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股每日追蹤</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,0.25), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(236,72,153,0.18), transparent 55%),
      linear-gradient(180deg, #05060a 0%, #0a0e1a 40%, #0a0d16 100%);
    color: #e8eaf2;
    padding: 28px 20px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 22px;
  }
  h1 {
    font-size: 26px;
    margin: 0;
    font-weight: 800;
    letter-spacing: 0.3px;
    background: linear-gradient(90deg, #a5b4fc, #f0abfc 45%, #fca5a5 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #34d399;
    background: rgba(52,211,153,0.12);
    border: 1px solid rgba(52,211,153,0.35);
    padding: 4px 10px;
    border-radius: 999px;
    margin-left: 10px;
    vertical-align: middle;
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 8px 2px rgba(52,211,153,0.7);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.75); }
  }
  .updated {
    font-size: 12.5px;
    color: #8a90a8;
    text-align: right;
  }
  .updated b { color: #c7cbe0; }

  .summary {
    position: relative;
    background: linear-gradient(135deg, rgba(99,102,241,0.14), rgba(236,72,153,0.08));
    border: 1px solid rgba(148,163,255,0.25);
    border-radius: 16px;
    padding: 18px 22px;
    margin-bottom: 26px;
    font-size: 14px;
    line-height: 1.75;
    color: #cfd3e8;
    backdrop-filter: blur(6px);
  }
  .summary .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: #c4b5fd;
    background: rgba(139,92,246,0.18);
    border: 1px solid rgba(139,92,246,0.4);
    padding: 2px 9px;
    border-radius: 999px;
    margin-bottom: 8px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
    margin-bottom: 34px;
  }
  .card {
    position: relative;
    background: linear-gradient(160deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    padding: 16px 18px;
    overflow: hidden;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity .18s ease;
    pointer-events: none;
  }
  .card.up::before { box-shadow: inset 0 0 40px rgba(248,113,113,0.18); }
  .card.down::before { box-shadow: inset 0 0 40px rgba(52,211,153,0.16); }
  .card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.2); }
  .card:hover::before { opacity: 1; }

  .card .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .card .code {
    font-size: 11px;
    color: #8a90a8;
    letter-spacing: 0.5px;
    background: rgba(255,255,255,0.06);
    padding: 2px 8px;
    border-radius: 6px;
  }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .badge.up { color: #fca5a5; background: rgba(248,113,113,0.14); border: 1px solid rgba(248,113,113,0.35); }
  .badge.down { color: #6ee7b7; background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.35); }

  .card .name { font-size: 15.5px; font-weight: 700; margin-bottom: 10px; color: #f1f2fa; }
  .card .price {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.2px;
    text-shadow: 0 0 18px currentColor;
  }
  .card .delta { font-size: 13px; font-weight: 700; margin-top: 4px; }
  .up { color: #f87171; }
  .down { color: #34d399; }
  .flat { color: #9ca3af; }

  h2 {
    font-size: 15px;
    margin: 0 0 14px;
    color: #d8dbee;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2::before {
    content: "";
    width: 4px; height: 16px;
    background: linear-gradient(180deg, #a5b4fc, #f0abfc);
    border-radius: 3px;
    display: inline-block;
  }

  .a-item {
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
    transition: border-color .15s ease, background .15s ease;
  }
  .a-item:hover { border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); }
  .a-item .a-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .a-item .a-code {
    font-size: 11px;
    color: #d8dbee;
    background: rgba(255,255,255,0.08);
    padding: 2px 9px;
    border-radius: 999px;
    font-weight: 600;
  }
  .a-item .a-name { font-weight: 700; font-size: 15px; color: #f1f2fa; }
  .a-item p { margin: 0; font-size: 13.5px; line-height: 1.7; color: #aeb2c8; }

  footer {
    font-size: 11.5px;
    color: #666c85;
    text-align: center;
    margin-top: 30px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  ::selection { background: rgba(139,92,246,0.4); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>📈 台股每日追蹤<span class="live-pill"><span class="live-dot"></span>AUTO</span></h1>
    </div>
    <div class="updated">最後更新<br><b>2026-07-22 11:18</b> · 資料來源：玩股網 wantgoo.com</div>
  </header>

  <div class="summary">
    <span class="tag">大盤脈動</span><br>
    台股近期連日強彈，台積電、聯電、力積電等半導體權值股輪番衝高，指數站上47K以上新高，資金明顯回流電子權值股，帶動0050、00919、009816等ETF隨盤上漲。今日以聯詠、台玻等AI相關題材股表現最強，銘旺科、達勝則呈現獨立走弱走勢。
  </div>

  <div class="grid" id="cards"></div>

  <h2>個股與新聞分析</h2>
  <section id="analysis"></section>

  <footer>此頁面由排程任務每日自動更新（週一至週五 09:00 / 11:00 / 13:00）。股價資訊僅供參考，不構成投資建議。</footer>
</div>

<script>
const stocks = [
  {code:"0050", name:"元大台灣50", price:104.00, change:1.50, pct:1.46,
    note:"ETF，追蹤台灣市值前50大權值股。半導體權值股（台積電、聯電）帶動大盤走強，0050隨盤上漲，屬穩健型核心持股。"},
  {code:"00919", name:"群益台灣精選高息", price:29.58, change:0.58, pct:2.00,
    note:"高股息ETF，成分股偏電子權值與金融股。今日隨大盤電子權值股走強而上漲，波動度中等，適合存股型投資人。"},
  {code:"009816", name:"凱基台灣TOP50", price:15.03, change:0.27, pct:1.83,
    note:"追蹤台灣前50大市值股票的ETF，走勢與0050高度連動，今日同步受惠半導體族群強漲。"},
  {code:"00955", name:"中信日本商社", price:14.83, change:0.16, pct:1.09,
    note:"追蹤日本大型商社（如三菱商事、三井物產等）的海外型ETF，走勢主要受日股與日圓匯率影響，與台股連動性較低。"},
  {code:"3034", name:"聯詠", price:501.00, change:25.00, pct:5.25,
    note:"邊緣AI題材持續發酵，法人估2027年營收年增近一成，加上IC設計族群受惠AI晶片熱潮，外資、投信買超不斷，今日領漲逾5%。短線動能強，但本益比已不低，追高須留意獲利了結賣壓。"},
  {code:"1802", name:"台玻", price:56.20, change:2.10, pct:3.88,
    note:"玻璃纖維布因AI伺服器、高階載板需求缺料，加上公司轉型「AI材料供應商」、擴產電子級玻纖布，帶動族群性上漲，題材延續性看俏。"},
  {code:"4979", name:"華星光", price:372.00, change:15.00, pct:4.20,
    note:"通信網路族群，近期波動大（曾單週重挫逾9%，本週回穩上漲）。本益比偏高（逾60倍），籌碼面波動劇烈，屬短線資金追捧標的，追高風險較高。"},
  {code:"2429", name:"銘旺科", price:41.15, change:-1.85, pct:-4.30,
    note:"光電小型股，近期股價震盪劇烈（單月已多次單日漲跌逾7%），營收成長平淡（今年前5月僅年增0.28%），今日逆勢下跌，籌碼投機性強，波動風險高。"},
  {code:"7419", name:"達勝", price:57.00, change:-0.87, pct:-1.50,
    note:"興櫃聚醯亞胺薄膜材料廠，近期股價走勢相對疲弱，缺乏明確利多消息，今日小跌，宜觀察後續營收表現。"},
  {code:"2812", name:"台中銀", price:20.50, change:0.05, pct:0.24,
    note:"4月營收年增近70%、月增37.58%，基本面穩健，加上金融股穩定配息題材，今日小漲，波動度低，屬穩健型持股。"},
];

const cardsEl = document.getElementById('cards');
const analysisEl = document.getElementById('analysis');

stocks.forEach(s => {
  const dirClass = s.change > 0 ? 'up' : (s.change < 0 ? 'down' : 'flat');
  const sign = s.change > 0 ? '+' : '';
  const arrow = s.change > 0 ? '▲' : (s.change < 0 ? '▼' : '─');

  const card = document.createElement('div');
  card.className = `card ${dirClass}`;
  card.innerHTML = `
    <div class="top-row">
      <span class="code">${s.code}</span>
      <span class="badge ${dirClass === 'flat' ? 'down' : dirClass}">${arrow} ${sign}${s.pct.toFixed(2)}%</span>
    </div>
    <div class="name">${s.name}</div>
    <div class="price ${dirClass}">${s.price.toFixed(2)}</div>
    <div class="delta ${dirClass}">${arrow} ${sign}${s.change.toFixed(2)}</div>
  `;
  cardsEl.appendChild(card);

  const item = document.createElement('div');
  item.className = 'a-item';
  item.innerHTML = `
    <div class="a-head">
      <span class="a-code">${s.code}</span>
      <span class="a-name">${s.name}</span>
      <span class="delta ${dirClass}" style="font-size:13px;">${arrow} ${sign}${s.pct.toFixed(2)}%</span>
    </div>
    <p>${s.note}</p>
  `;
  analysisEl.appendChild(item);
});
</script>
</body>
</html>
